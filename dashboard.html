<!DOCTYPE html>
<html>

<head>

<title>AI Cloudburst EWS</title>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(to bottom,#031525,#0a2744);
    color:white;
    text-align:center;
}

h1{
    padding:20px;
    font-size:38px;
}

#alertBanner{
    width:92%;
    margin:auto;
    margin-bottom:15px;
    padding:14px;
    border-radius:14px;
    font-size:26px;
    font-weight:bold;
    display:none;
    animation: blink 1s infinite;
}

@keyframes blink{
    50%{
        opacity:0.5;
    }
}

#map{
    height:400px;
    width:92%;
    margin:auto;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

.cards{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    margin-top:20px;
}

.card{
    background:linear-gradient(145deg,#0b2d4d,#123d63);
    width:180px;
    margin:12px;
    padding:20px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    font-size:22px;
    margin:0;
}

.value{
    font-size:30px;
    font-weight:bold;
    margin-top:18px;
}

.footer{
    margin-top:25px;
    padding-bottom:20px;
    opacity:0.8;
}

</style>

</head>

<body>

<h1>☁️ AI Cloudburst Early Warning System</h1>

<div id="alertBanner"></div>

<div id="map"></div>

<div class="cards">

    <div class="card">
        <h2>🌧 Rainfall</h2>
        <div class="value" id="rainfall">0</div>
    </div>

    <div class="card">
        <h2>🧠 AI Risk</h2>
        <div class="value" id="risk">0%</div>
    </div>

    <div class="card">
        <h2>⚠ Status</h2>
        <div class="value" id="status">Normal</div>
    </div>

    <div class="card">
        <h2>🕒 Time</h2>
        <div class="value" id="time">--:--</div>
    </div>

</div>

<div class="footer">
Real-Time Hyperlocal Disaster Monitoring System
</div>

<script>

// -----------------------------
// MAP
// -----------------------------

var map = L.map('map').setView(
    [30.7046, 76.7179],
    12
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

var marker = L.marker(
    [30.7046, 76.7179]
).addTo(map);

// -----------------------------
// FETCH DATA
// -----------------------------

async function fetchData(){

    let response = await fetch('/getdata');

    let data = await response.json();

    document.getElementById("rainfall").innerHTML =
    data.rainfall;

    document.getElementById("risk").innerHTML =
    data.risk + "%";

    document.getElementById("status").innerHTML =
    data.status;

    document.getElementById("time").innerHTML =
    data.time;

    // -----------------------------
    // STATUS COLORS
    // -----------------------------

    let statusElement =
    document.getElementById("status");

    if(data.status == "Normal Risk"){

        statusElement.style.color = "#00ff88";
    }

    else if(data.status == "Average Risk"){

        statusElement.style.color = "#ffd000";
    }

    else if(data.status == "High Risk"){

        statusElement.style.color = "#ff8800";
    }

    else{

        statusElement.style.color = "#ff3b3b";
    }

    // -----------------------------
    // ALERT BANNER
    // -----------------------------

    let banner =
    document.getElementById("alertBanner");

    if(data.risk >= 95){

        banner.style.display = "block";

        banner.style.background =
        "linear-gradient(90deg,#ff0000,#b30000)";

        banner.innerHTML =
        "🚨 EXTREME DANGER ALERT 🚨";
    }

    else{

        banner.style.display = "none";
    }

    // -----------------------------
    // MAP UPDATE
    // -----------------------------

    marker.setLatLng([
        data.lat,
        data.lon
    ]);

    map.setView([
        data.lat,
        data.lon
    ],12);
}

fetchData();

setInterval(fetchData,3000);

</script>

</body>
</html>
