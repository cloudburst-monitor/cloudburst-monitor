<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Cloudburst Early Warning System</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
    linear-gradient(
    180deg,
    #02111f,
    #062540,
    #041a2d
    );

    color:white;

    overflow-x:hidden;
}

/* -----------------------------
HEADER
----------------------------- */

.header{

    width:100%;

    padding:25px;

    text-align:center;

    backdrop-filter:blur(10px);

    background:
    rgba(255,255,255,0.03);

    border-bottom:
    1px solid rgba(255,255,255,0.08);
}

.header h1{

    font-size:42px;

    font-weight:700;

    letter-spacing:1px;
}

.header p{

    margin-top:8px;

    opacity:0.8;

    font-size:16px;
}

/* -----------------------------
ALERT BANNER
----------------------------- */

#alertBanner{

    width:92%;

    margin:20px auto;

    padding:18px;

    border-radius:18px;

    font-size:28px;

    font-weight:700;

    display:none;

    animation:blink 1s infinite;

    box-shadow:0 0 25px red;
}

@keyframes blink{

    50%{
        opacity:0.5;
    }
}

/* -----------------------------
MAP
----------------------------- */

.map-container{

    width:92%;

    margin:auto;

    margin-top:20px;
}

#map{

    height:450px;

    border-radius:24px;

    overflow:hidden;

    box-shadow:
    0 10px 35px rgba(0,0,0,0.5);
}

/* -----------------------------
CARDS
----------------------------- */

.cards{

    width:92%;

    margin:auto;

    margin-top:30px;

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:20px;
}

.card{

    position:relative;

    overflow:hidden;

    padding:28px;

    border-radius:24px;

    background:
    rgba(255,255,255,0.05);

    backdrop-filter:blur(12px);

    border:
    1px solid rgba(255,255,255,0.08);

    transition:0.35s;
}

.card:hover{

    transform:
    translateY(-8px);

    box-shadow:
    0 10px 30px rgba(0,0,0,0.45);
}

.card::before{

    content:"";

    position:absolute;

    width:140px;
    height:140px;

    background:
    rgba(255,255,255,0.06);

    border-radius:50%;

    top:-50px;
    right:-40px;
}

.card h2{

    font-size:20px;

    font-weight:500;

    opacity:0.9;
}

.value{

    margin-top:18px;

    font-size:38px;

    font-weight:700;
}

/* -----------------------------
STATUS COLORS
----------------------------- */

.normal{
    color:#00ff88;
}

.average{
    color:#ffd000;
}

.high{
    color:#ff8800;
}

.extreme{
    color:#ff3b3b;
}

/* -----------------------------
FOOTER
----------------------------- */

.footer{

    margin-top:35px;

    padding:25px;

    text-align:center;

    opacity:0.7;

    font-size:15px;
}

/* -----------------------------
RESPONSIVE
----------------------------- */

@media(max-width:768px){

    .header h1{

        font-size:30px;
    }

    #map{

        height:350px;
    }

    .value{

        font-size:30px;
    }

    #alertBanner{

        font-size:22px;
    }
}

</style>

</head>

<body>

<!-- -----------------------------
HEADER
------------------------------ -->

<div class="header">

    <h1>☁️ AI Cloudburst Early Warning System</h1>

    <p>
    Real-Time Hyperlocal Disaster Monitoring Dashboard
    </p>

</div>

<!-- -----------------------------
ALERT BANNER
------------------------------ -->

<div id="alertBanner"></div>

<!-- -----------------------------
MAP
------------------------------ -->

<div class="map-container">

    <div id="map"></div>

</div>

<!-- -----------------------------
CARDS
------------------------------ -->

<div class="cards">

    <div class="card">

        <h2>🌧 Rainfall</h2>

        <div class="value"
        id="rainfall">

        0

        </div>

    </div>

    <div class="card">

        <h2>🧠 AI Risk</h2>

        <div class="value"
        id="risk">

        0%

        </div>

    </div>

    <div class="card">

        <h2>⚠ Status</h2>

        <div class="value"
        id="status">

        Normal

        </div>

    </div>

    <div class="card">

        <h2>🕒 Time</h2>

        <div class="value"
        id="time">

        --:--

        </div>

    </div>

</div>

<!-- -----------------------------
FOOTER
------------------------------ -->

<div class="footer">

AI-Powered Hyperlocal Climate Intelligence Platform

</div>

<script>

/* -----------------------------
MAP
----------------------------- */

var map = L.map('map').setView(
    [30.7046,76.7179],
    12
);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}
).addTo(map);

var marker = L.marker(
    [30.7046,76.7179]
).addTo(map);

/* -----------------------------
FETCH DATA
----------------------------- */

async function fetchData(){

    let response =
    await fetch('/getdata');

    let data =
    await response.json();

    document.getElementById(
    "rainfall").innerHTML =
    data.rainfall;

    document.getElementById(
    "risk").innerHTML =
    data.risk + "%";

    document.getElementById(
    "status").innerHTML =
    data.status;

    document.getElementById(
    "time").innerHTML =
    data.time;

    /* -----------------------------
    STATUS COLORS
    ----------------------------- */

    let statusElement =
    document.getElementById("status");

    statusElement.className =
    "value";

    if(data.status ==
    "Normal Risk"){

        statusElement.classList
        .add("normal");
    }

    else if(data.status ==
    "Average Risk"){

        statusElement.classList
        .add("average");
    }

    else if(data.status ==
    "High Risk"){

        statusElement.classList
        .add("high");
    }

    else{

        statusElement.classList
        .add("extreme");
    }

    /* -----------------------------
    ALERT BANNER
    ----------------------------- */

    let banner =
    document.getElementById(
    "alertBanner");

    if(data.risk >= 95){

        banner.style.display =
        "block";

        banner.style.background =
        "linear-gradient(90deg,#ff0000,#b30000)";

        banner.innerHTML =
        "🚨 EXTREME DANGER ALERT 🚨";
    }

    else{

        banner.style.display =
        "none";
    }

    /* -----------------------------
    MAP UPDATE
    ----------------------------- */

    marker.setLatLng([
        data.lat,
        data.lon
    ]);

    map.setView([
        data.lat,
        data.lon
    ],12);
}

fetchData();

setInterval(fetchData,3000);

</script>

</body>
</html>
